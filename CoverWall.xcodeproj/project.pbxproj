			shellScript = "set -euo pipefail\n# actool sometimes emits a thinned icns; rebuild a complete one and re-sign.\nif [ \"${PLATFORM_NAME:-}\" != \"macosx\" ]; then\n  exit 0\nfi\nSRC=\"${PROJECT_DIR}/Design/AppIcon/png\"\nAPP=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\nICONSET=\"${DERIVED_FILE_DIR}/AppIcon.iconset\"\nICNS=\"${APP}/Contents/Resources/AppIcon.icns\"\nrm -rf \"${ICONSET}\"\nmkdir -p \"${ICONSET}\"\ncp \"${SRC}/AppIcon-Light-16.png\"   \"${ICONSET}/icon_16x16.png\"\ncp \"${SRC}/AppIcon-Light-32.png\"   \"${ICONSET}/icon_16x16@2x.png\"\ncp \"${SRC}/AppIcon-Light-32.png\"   \"${ICONSET}/icon_32x32.png\"\ncp \"${SRC}/AppIcon-Light-64.png\"   \"${ICONSET}/icon_32x32@2x.png\"\ncp \"${SRC}/AppIcon-Light-128.png\"  \"${ICONSET}/icon_128x128.png\"\ncp \"${SRC}/AppIcon-Light-256.png\"  \"${ICONSET}/icon_128x128@2x.png\"\ncp \"${SRC}/AppIcon-Light-256.png\"  \"${ICONSET}/icon_256x256.png\"\ncp \"${SRC}/AppIcon-Light-512.png\"  \"${ICONSET}/icon_256x256@2x.png\"\ncp \"${SRC}/AppIcon-Light-512.png\"  \"${ICONSET}/icon_512x512.png\"\ncp \"${SRC}/AppIcon-Light-1024.png\" \"${ICONSET}/icon_512x512@2x.png\"\niconutil -c icns \"${ICONSET}\" -o \"${ICNS}\"\ncodesign --force --sign - --timestamp=none \"${APP}\" >/dev/null 2>&1 || true\ntouch \"${APP}\"\nLSREGISTER=\"/System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister\"\n\"${LSREGISTER}\" -f \"${APP}\" >/dev/null 2>&1 || true\n";
		};
